<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="学习搭子">
<meta name="theme-color" content="#7c6ff7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="学习搭子">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>学习搭子 - 多账户版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#faf8ff;--card:#fff;--text:#2d2b3a;--sub:#8b87a0;--purple:#7c6ff7;--pink:#f472b6;--mint:#34d399;--amber:#fbbf24;--red:#f87171;--blue:#60a5fa;--shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.06);--radius:20px;--radius-sm:14px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent;user-select:none;overflow-x:hidden}
.container{max-width:480px;margin:0 auto;padding:12px 16px}

/* 登录/账户选择界面 */
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-title{font-size:28px;font-weight:800;color:var(--purple);margin-bottom:8px}
.login-sub{font-size:14px;color:var(--sub);margin-bottom:40px;text-align:center}
.user-list{width:100%;max-width:300px;margin-bottom:20px}
.user-item{background:var(--card);border-radius:var(--radius-sm);padding:16px;margin-bottom:12px;display:flex;align-items:center;box-shadow:var(--shadow);cursor:pointer;transition:transform .2s}
.user-item:active{transform:scale(.98)}
.user-avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#e0d9ff,#c4b5fd);display:flex;align-items:center;justify-content:center;font-size:24px;margin-right:16px}
.user-info{flex:1}
.user-name{font-size:16px;font-weight:600}
.user-stats{font-size:12px;color:var(--sub);margin-top:4px}
.btn-login{background:var(--purple);color:white;border:none;border-radius:var(--radius-sm);padding:16px;font-size:16px;font-weight:600;width:100%;max-width:300px;cursor:pointer;box-shadow:0 4px 12px rgba(124,111,247,.3);transition:opacity .2s}
.btn-login:active{opacity:.8}

/* 主应用界面 */
.app-screen{display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 0 12px}
.greeting{font-size:13px;color:var(--sub)}.greeting b{display:block;font-size:20px;color:var(--text);font-weight:700;margin-top:2px}
.mascot-wrap{position:relative}
.mascot{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#e0d9ff,#c4b5fd);display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 4px 16px rgba(124,111,247,.25);cursor:pointer;transition:transform .2s}
.mascot:active{transform:scale(.9)}
.mascot-bubble{position:absolute;top:-42px;right:-20px;background:var(--text);color:#fff;font-size:11px;padding:6px 10px;border-radius:12px 12px 12px 4px;white-space:nowrap;opacity:0;transform:translateY(4px);transition:all .3s;pointer-events:none;max-width:180px;white-space:normal;line-height:1.4}
.mascot-bubble.show{opacity:1;transform:translateY(0)}

.stat-row{display:flex;gap:8px;margin-bottom:10px}
.stat-card{flex:1;background:var(--card);border-radius:var(--radius-sm);padding:12px;box-shadow:var(--shadow);text-align:center}
.stat-num{font-size:24px;font-weight:800;line-height:1}
.stat-num.purple{color:var(--purple)}.stat-num.pink{color:var(--pink)}.stat-num.mint{color:var(--mint)}
.stat-label{font-size:10px;color:var(--sub);margin-top:3px}

.date-strip{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
.date-chip{flex-shrink:0;width:48px;text-align:center;padding:8px 4px;border-radius:var(--radius-sm);background:var(--card);box-shadow:var(--shadow);cursor:pointer;transition:all .2s}
.date-chip.active{background:var(--purple);color:#fff}
.date-chip.today{outline:2px solid var(--purple)}
.dow{font-size:10px;opacity:.7}.dom{font-size:16px;font-weight:700}

.progress-wrap{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.progress-bar{flex:1;height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:var(--purple);border-radius:4px;transition:width .3s}
.progress-pct{font-size:14px;font-weight:600;color:var(--purple);min-width:40px}

.buddy-msg{background:var(--card);border-radius:var(--radius-sm);padding:12px;box-shadow:var(--shadow);display:flex;gap:12px;margin-bottom:16px;cursor:pointer}
.buddy-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#e0d9ff,#c4b5fd);display:flex;align-items:center;justify-content:center;font-size:20px}
.buddy-text{flex:1}
.buddy-text .name{font-size:12px;color:var(--sub);margin-bottom:4px}
.buddy-text .msg{font-size:14px;line-height:1.4}

.section-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.section-title{font-size:16px;font-weight:600}
.btn-sm{background:var(--purple);color:white;border:none;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer}

.task-list{margin-bottom:20px}
.task{background:var(--card);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;transition:all .2s}
.task.done{opacity:.6}
.task-emoji{font-size:20px}
.task-info{flex:1}
.task-name{font-size:14px;font-weight:500;line-height:1.4}
.task-time{font-size:11px;color:var(--sub);margin-top:4px;display:flex;align-items:center;gap:6px}
.task-tag{font-size:10px;padding:2px 6px;border-radius:10px;background:#e5e7eb}
.task-edit,.task-check{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;transition:background .2s}
.task-edit{background:#f3f4f6;color:var(--sub)}
.task-check{background:var(--mint);color:#fff}

.reward-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.reward-btn{background:var(--card);border:1px solid #e5e7eb;border-radius:var(--radius-sm);padding:16px;text-align:center;cursor:pointer;transition:all .2s}
.reward-btn:active{transform:scale(.98);background:#f9fafb}
.reward-btn .icon{font-size:24px;display:block;margin-bottom:8px}
.reward-btn .cost{font-size:11px;color:var(--sub);margin-top:4px}

.bottom-actions{display:flex;gap:8px;margin-bottom:20px}
.btn{flex:1;padding:12px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;transition:all .2s}
.btn-outline{background:transparent;border:1px solid #e5e7eb;color:var(--text)}
.btn-solid{background:var(--purple);border:none;color:#fff}

/* 游戏样式 */
.game-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.game-cell{aspect-ratio:1;background:var(--card);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;box-shadow:var(--shadow);transition:all .3s}
.game-cell.hidden{background:var(--purple);color:transparent}
.game-cell.shown{background:var(--card);color:var(--text)}
.game-cell.matched{background:var(--mint);color:#fff;transform:scale(.95)}

.game-whack{position:relative;height:200px;background:#f3f4f6;border-radius:var(--radius-sm);margin:16px 0;overflow:hidden}
.mole{position:absolute;width:60px;height:60px;background:var(--amber);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;transition:all .1s}
.mole.hit{background:var(--red);transform:scale(1.2)}

.game-quiz{text-align:center;margin:16px 0}
.quiz-question{font-size:32px;font-weight:800;margin:20px 0}
.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quiz-option{background:var(--card);border:1px solid #e5e7eb;border-radius:var(--radius-sm);padding:16px;font-size:18px;cursor:pointer;transition:all .2s}
.quiz-option.correct{background:var(--mint);color:#fff}
.quiz-option.wrong{background:var(--red);color:#fff}

.game-bubble{position:relative;height:200px;background:#f3f4f6;border-radius:var(--radius-sm);margin:16px 0;overflow:hidden}
.bubble{position:absolute;width:40px;height:40px;background:var(--blue);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;animation:float 3s linear infinite}
@keyframes float{
  0%{transform:translateY(200px) scale(1);opacity:1}
  100%{transform:translateY(-40px) scale(1.2);opacity:0}
}

/* 弹窗 */
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.overlay-content{background:var(--bg);border-radius:var(--radius);padding:20px;max-width:400px;width:100%;max-height:80vh;overflow-y:auto}
.sheet-handle{width:40px;height:4px;background:#d1d5db;border-radius:2px;margin:0 auto 16px}

/* 安装按钮 */
#installBtn{display:none;position:fixed;bottom:80px;right:16px;z-index:1000;background:var(--purple);color:white;border:none;border-radius:50%;width:56px;height:56px;box-shadow:0 4px 12px rgba(124,111,247,.4);font-size:24px;cursor:pointer}
</style>
</head>
<body>
<!-- 登录/账户选择界面 -->
<div id="loginScreen" class="login-screen">
  <div class="login-title">学习搭子</div>
  <div class="login-sub">单机多账户版 · 数据不冲突</div>
  
  <div id="userList" class="user-list">
    <!-- 用户列表会动态生成 -->
  </div>
  
  <button class="btn-login" onclick="createNewUser()">+ 创建新账户</button>
</div>

<!-- 主应用界面 -->
<div id="appScreen" class="app-screen">
  <div class="container">
    <div id="app"></div>
  </div>
</div>

<!-- 游戏弹窗 -->
<div id="ol-reward" class="overlay">
  <div class="overlay-content">
    <div class="sheet-handle"></div>
    <div id="reward-sheet"></div>
  </div>
</div>

<script>
// ======== 多账户数据管理 ========
const STORAGE_KEY = 'yuhan_multi_v1';
let currentUser = null;
let users = {};

function loadUsers() {
  const data = localStorage.getItem(STORAGE_KEY);
  if (data) {
    try {
      users = JSON.parse(data);
    } catch(e) {
      users = {};
    }
  }
}

function saveUsers() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(users));
}

function createNewUser() {
  const userName = prompt('请输入你的名字（如：李语涵）');
  if (!userName || userName.trim() === '') return;
  
  const userId = 'user_' + Date.now();
  const userEmoji = ['🐱','🐶','🐼','🦊','🐯','🐰','🐻','🐨'][Math.floor(Math.random()*8)];
  
  users[userId] = {
    id: userId,
    name: userName,
    emoji: userEmoji,
    created: new Date().toISOString(),
    data: {
      allTasks: {},
      completed: {},
      coins: 100,
      streak: 0,
      themeColor: '#7c6ff7',
      planTitle: userName + '的学习计划',
      buddyName: '学习搭子',
      mascotEmoji: userEmoji,
      selectedDay: String(new Date().getDay()),
      lastDate: todayKey(),
      unlockedThemes: new Set(['#7c6ff7','#f472b6','#34d399','#fbbf24','#f87171','#60a5fa'])
    }
  };
  
  saveUsers();
  loginUser(userId);
}

function loginUser(userId) {
  currentUser = userId;
  loadUserData();
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  render();
}

function logoutUser() {
  currentUser = null;
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('appScreen').style.display = 'none';
  renderUserList();
}

function renderUserList() {
  const userList = document.getElementById('userList');
  const userArray = Object.values(users);
  
  if (userArray.length === 0) {
    userList.innerHTML = '<div style="text-align:center;color:var(--sub);padding:20px">还没有账户，点击下方创建</div>';
    return;
  }
  
  userList.innerHTML = userArray.map(user => `
    <div class="user-item" onclick="loginUser('${user.id}')">
      <div class="user-avatar">${user.emoji}</div>
      <div class="user-info">
        <div class="user-name">${user.name}</div>
        <div class="user-stats">${user.data?.coins || 0}币 · ${user.data?.streak || 0}天连续</div>
      </div>
    </div>
  `).join('');
}

// ======== 用户数据操作 ========
let allTasks, weeklyTasks, completed, coins, streak, themeColor, planTitle, buddyName, mascotEmoji, selectedDay, unlockedThemes;

function loadUserData() {
  if (!currentUser || !users[currentUser]) return;
  const userData = users[currentUser].data;
  
  allTasks = userData.allTasks || {};
  weeklyTasks = userData.weeklyTasks || {};
  completed = userData.completed || {};
  coins = userData.coins || 100;
  streak = userData.streak || 0;
  themeColor = userData.themeColor || '#7c6ff7';
  planTitle = userData.planTitle || users[currentUser].name + '的学习计划';
  buddyName = userData.buddyName || '学习搭子';
  mascotEmoji = userData.mascotEmoji || users[currentUser].emoji;
  selectedDay = userData.selectedDay || String(new Date().getDay());
  unlockedThemes = new Set(userData.unlockedThemes || ['#7c6ff7']);
  
  // 检查连续天数
  checkStreak();
  
  // 确保每周任务存在
  ensureWeeklyTasks();
}

function saveUserData() {
  if (!currentUser || !users[currentUser]) return;
  
  users[currentUser].data = {
    allTasks,
    weeklyTasks,
    completed,
    coins,
    streak,
    themeColor,
    planTitle,
    buddyName,
    mascotEmoji,
    selectedDay,
    lastDate: todayKey(),
    unlockedThemes: Array.from(unlockedThemes)
  };
  
  saveUsers();
}

// ======== 核心功能（与原版相同） ========
function todayKey(){return new Date().toISOString().split('T')[0]}
function dayOfWeek(ds){return new Date(ds+'T00:00:00').getDay()}
function greetText(){
  const h=new Date().getHours();
  if(h<5)return'深夜了，早点休息';
  if(h<12)return'早上好';
  if(h<14)return'中午好';
  if(h<18)return'下午好';
  if(h<22)return'晚上好';
  return'夜深了';
}

// 确保每周任务存在并同步到当天
function ensureWeeklyTasks() {
  const today = todayKey();
  const dow = dayOfWeek(today);
  const dowStr = String(dow);
  
  // 如果当天没有任务，但周任务存在，则同步
  if (!allTasks[dowStr] || allTasks[dowStr].length === 0) {
    if (weeklyTasks[dowStr] && weeklyTasks[dowStr].length > 0) {
      // 复制周任务到当天，生成新的ID
      allTasks[dowStr] = weeklyTasks[dowStr].map(task => ({
        ...task,
        id: 't' + Date.now() + Math.random().toString(36).substr(2, 4)
      }));
      saveUserData();
    }
  }
}

function checkStreak(){
  const today=todayKey(),last=users[currentUser]?.data?.lastDate;
  if(last&&isYesterday(last,today))streak++;else if(!last||!isYesterday(last,today))streak=1;
}
function isYesterday(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)===1}
function getDayTasks(dk){return allTasks[dk]||[]}
function getTodayCompleted(){return new Set(completed[todayKey()]||[])}

function render(){
  if (!currentUser) return;
  
  const app=document.getElementById('app');
  const today=todayKey(),dow=dayOfWeek(today);
  const todayDone=getTodayCompleted();
  const curTasks=getDayTasks(selectedDay);
  const curDone=selectedDay===String(dow)?todayDone:new Set();
  const doneCnt=curTasks.filter(t=>curDone.has(t.id)).length;
  const pct=curTasks.length?Math.round(doneCnt/curTasks.length*100):0;
  
  const names=['日','一','二','三','四','五','六'];
  const td=new Date(today+'T00:00:00'),start=new Date(td);start.setDate(td.getDate()-td.getDay());
  const dates=[];
  for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);dates.push({ds:d.toISOString().split('T')[0],dow:i,dom:d.getDate()})}
  
  app.innerHTML=`
<div class="topbar">
  <div class="greeting"><span>${greetText()}</span><b>${planTitle}</b></div>
  <div class="mascot-wrap" onclick="tapMascot()">
    <div class="mascot">${mascotEmoji}</div>
    <div class="mascot-bubble" onclick="event.stopPropagation();logoutUser()">切换账户</div>
  </div>
</div>

<div class="stat-row">
  <div class="stat-card"><div class="stat-num purple">${doneCnt}</div><div class="stat-label">今日完成</div></div>
  <div class="stat-card"><div class="stat-num pink">${streak}</div><div class="stat-label">连续天数</div></div>
  <div class="stat-card"><div class="stat-num mint">${coins}</div><div class="stat-label">学习币</div></div>
</div>

<div class="date-strip">
  ${dates.map(d=>`<div class="date-chip${String(d.dow)===selectedDay?' active':''}${d.ds===today?' today':''}" onclick="selectDay('${d.dow}')"><div class="dow">周${names[d.dow]}</div><div class="dom">${d.dom}</div></div>`).join('')}
</div>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
  <div class="progress-pct">${pct}%</div>
</div>

<div class="buddy-msg" onclick="refreshBuddy()">
  <div class="buddy-avatar">${mascotEmoji}</div>
  <div class="buddy-text"><div class="name">${buddyName}</div><div class="msg">${pickBuddyMsg(doneCnt,curTasks.length)}</div></div>
</div>

<div class="section-row">
  <div class="section-title">📋 ${['周日','周一','周二','周三','周四','周五','周六'][parseInt(selectedDay)]}任务</div>
  <button class="btn-sm" onclick="openTaskForm(null)">+ 添加</button>
</div>
<div class="task-list">
  ${curTasks.map(t=>`<div class="task${curDone.has(t.id)?' done':''}" id="task-${t.id}">
    <div class="task-emoji">${t.emoji||'📝'}</div>
    <div class="task-info"><div class="task-name">${t.name}</div><div class="task-time">🕐 ${t.time||''}<span class="task-tag">${t.tag||'任务'}</span></div></div>
    <div class="task-edit" onclick="event.stopPropagation();openTaskForm('${t.id}')">✏️</div>
    <div class="task-check" onclick="event.stopPropagation();toggleTask('${t.id}')">✓</div>
  </div>`).join('')||'<div style="text-align:center;color:var(--sub);padding:20px;font-size:13px">还没有任务，右上角加一个</div>'}
</div>

<div class="section-title" style="margin-bottom:6px">🎁 兑换奖励</div>
<div class="reward-grid">
  <button class="reward-btn" onclick="openGua()"><span class="icon">🍉</span>吃瓜时间<span class="cost">5币</span></button>
  <button class="reward-btn" onclick="openGames()"><span class="icon">🎮</span>解压游戏<span class="cost">10币</span></button>
  <button class="reward-btn" onclick="openReward('theme')"><span class="icon">🎨</span>解锁新主题<span class="cost">30币</span></button>
  <button class="reward-btn" onclick="openReward('care')"><span class="icon">🫂</span>搭子抱抱<span class="cost">0币</span></button>
</div>

<div class="bottom-actions">
  <button class="btn btn-outline" onclick="openSettings()">⚙️ 设置</button>
  <button class="btn btn-solid" onclick="resetToday()">🔄 重置今天</button>
</div>
<button id="installBtn" style="display:none;position:fixed;bottom:80px;right:16px;z-index:1000;background:var(--purple);color:white;border:none;border-radius:50%;width:56px;height:56px;box-shadow:0 4px 12px rgba(124,111,247,.4);font-size:24px;cursor:pointer">📱</button>`;
}

// ======== 游戏功能（完整实现） ========
function openGames(){
  const ol=document.getElementById('ol-reward'),rs=document.getElementById('reward-sheet');
  rs.innerHTML=`<div class="sheet-handle"></div><h3>🎮 选一个游戏</h3>
    <div class="game-select">
      <div class="game-opt" onclick="startMemoryGame()"><div class="go-icon">🃏</div><div class="go-name">记忆翻牌</div><div class="go-desc">找出相同配对的卡片</div></div>
      <div class="game-opt" onclick="startWhackGame()"><div class="go-icon">🔨</div><div class="go-name">打地鼠</div><div class="go-desc">打中冒出来的地鼠</div></div>
      <div class="game-opt" onclick="startQuizGame()"><div class="go-icon">🧮</div><div class="go-name">速算挑战</div><div class="go-desc">限时心算答题</div></div>
      <div class="game-opt" onclick="startBubbleGame()"><div class="go-icon">🫧</div><div class="go-name">戳泡泡</div><div class="go-desc">疯狂戳破泡泡</div></div></div>

let memoryCards = [], memoryFlipped = [], memoryMatched = 0;
function startMemoryGame() {
  if (coins < 10) { toast('需要10币，当前:'+coins+'币'); return; }
  coins -= 10; saveUserData(); render();
  
  // 创建卡片对
  const symbols = ['🌟','💎','🔥','🎯','💖','✨','⭐','💫'];
  memoryCards = [...symbols, ...symbols];
  memoryFlipped = [];
  memoryMatched = 0;
  
  // 洗牌
  for (let i = memoryCards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [memoryCards[i], memoryCards[j]] = [memoryCards[j], memoryCards[i]];
  }
  
  const rs = document.getElementById('reward-sheet');
  rs.innerHTML = `<div class="sheet-handle"></div><h3>🃏 记忆翻牌</h3>
    <p style="text-align:center;color:var(--sub);margin-bottom:8px">点击卡片翻开，找出相同配对</p>
    <div class="game-grid" id="memory-grid"></div>
    <div style="text-align:center;margin:12px 0;font-size:14px">已配对: <span id="memory-matched">0</span>/8</div>
    <button class="btn btn-solid" style="width:100%;margin-top:10px" onclick="endMemoryGame()">结束游戏</button>`;
  
  const grid = document.getElementById('memory-grid');
  grid.innerHTML = memoryCards.map((symbol, index) => 
    `<div class="game-cell hidden" onclick="flipMemoryCard(${index})">?</div>`
  ).join('');
}

function flipMemoryCard(index) {
  const cell = document.getElementById('memory-grid').children[index];
  if (cell.classList.contains('matched') || cell.classList.contains('shown') || memoryFlipped.length >= 2) return;
  
  cell.classList.remove('hidden');
  cell.classList.add('shown');
  cell.textContent = memoryCards[index];
  memoryFlipped.push({index, symbol: memoryCards[index]});
  
  if (memoryFlipped.length === 2) {
    const [card1, card2] = memoryFlipped;
    if (card1.symbol === card2.symbol) {
      // 匹配成功
      setTimeout(() => {
        document.getElementById('memory-grid').children[card1.index].classList.add('matched');
        document.getElementById('memory-grid').children[card2.index].classList.add('matched');
        memoryMatched++;
        document.getElementById('memory-matched').textContent = memoryMatched;
        memoryFlipped = [];
        
        if (memoryMatched === 8) {
          coins += 20; // 完成奖励
          saveUserData();
          toast('🎉 游戏完成！奖励20币');
        }
      }, 500);
    } else {
      // 不匹配，翻回去
      setTimeout(() => {
        document.getElementById('memory-grid').children[card1.index].classList.remove('shown');
        document.getElementById('memory-grid').children[card1.index].classList.add('hidden');
        document.getElementById('memory-grid').children[card2.index].classList.remove('shown');
        document.getElementById('memory-grid').children[card2.index].classList.add('hidden');
        memoryFlipped = [];
      }, 1000);
    }
  }
}

function endMemoryGame() {
  closeOverlay('ol-reward');
}

function startQuizGame() {
  if (coins < 10) { toast('需要10币，当前:'+coins+'币'); return; }

  startQuizQuestion();
  quizTimer = setInterval(() => {
    quizTime--;
    const timeEl = document.getElementById('quiz-time');
    if (timeEl) timeEl.textContent = quizTime;
    if (quizTime <= 0) endQuizGame();
  }, 1000);
}

function startQuizQuestion() {
  const area = document.getElementById('quiz-area');
  if (!area || quizTime <= 0) return;
  
  const a = Math.floor(Math.random() * 20) + 1;
  const b = Math.floor(Math.random() * 20) + 1;
  const ops = ['+','-','×','÷'];
  const op = ops[Math.floor(Math.random() * 4)];
  let correct, options = [];
  
  if (op === '+') correct = a + b;
  else if (op === '-') correct = a - b;
  else if (op === '×') correct = a * b;
  else { // ÷
    const product = a * b;
    correct = a;
    options = [correct, Math.floor(Math.random() * 20) + 1, Math.floor(Math.random() * 20) + 1, Math.floor(Math.random() * 20) + 1];
  }
  
  if (op !== '÷') {
    options = [correct];
    while (options.length < 4) {
      const wrong = correct + (Math.random() > 0.5 ? 1 : -1) * (Math.floor(Math.random() * 5) + 1);
      if (!options.includes(wrong) && wrong > 0) options.push(wrong);
    }
  }
  
  // 洗牌选项
  for (let i = options.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [options[i], options[j]] = [options[j], options[i]];
  }
  
  area.innerHTML = `
    <div class="quiz-question">${a} ${op} ${b} = ?</div>
    <div class="quiz-options">
      ${options.map((opt, idx) => 
        `<div class="quiz-option" onclick="checkQuizAnswer(${opt}, ${correct}, ${idx})">${opt}</div>`
      ).join('')}
    </div>`;
}

function checkQuizAnswer(selected, correct, idx) {
  const options = document.querySelectorAll('.quiz-option');
  options[idx].classList.add(selected === correct ? 'correct' : 'wrong');
  
  if (selected === correct) {
    quizScore += 5;
    document.getElementById('quiz-score').textContent = quizScore;
  }
  
  setTimeout(startQuizQuestion, 1000);
}

function endQuizGame() {
  if (quizTimer) clearInterval(quizTimer);
  const reward = Math.min(30, Math.floor(quizScore / 2));
  coins += reward;
  saveUserData();
  toast(`游戏结束！得分:${quizScore} 奖励:${reward}币`);
  closeOverlay('ol-reward');
}

  content.style.cssText = 'background:var(--bg);border-radius:16px;padding:24px;width:320px;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,0.2);';
  
  content.innerHTML = `
    <h3 style="margin:0 0 16px;color:var(--text);font-size:16px;font-weight:600;">⚙️ 设置</h3>
    <p style="margin:0 0 12px;color:var(--sub);font-size:13px;">系统功能与说明</p>
    <div style="margin-bottom:16px;padding:12px;background:var(--card);border-radius:8px;font-size:13px;line-height:1.6;">
      <p><strong>账户切换</strong>: 点击右上角猫头可切换账户</p>
      <p><strong>数据存储</strong>: 数据完全本地存储，每个账户独立不冲突</p>
      <p><strong>周循环任务</strong>: 添加任务时勾选"设为周循环任务"，该任务会每周自动出现</p>
      <p><strong>每日任务</strong>: 当天如需修改，直接编辑任务即可</p>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button id="closeBtn" style="padding:8px 16px;border:1px solid var(--border);background:none;color:var(--text);border-radius:8px;font-size:14px;cursor:pointer;">关闭</button>
      <button id="manageWeeklyBtn" style="padding:8px 16px;border:none;background:var(--purple);color:white;border-radius:8px;font-size:14px;cursor:pointer;">管理周任务</button>
    </div>
  `;
  
  modal.appendChild(content);
  document.body.appendChild(modal);
  
  const closeBtn = content.querySelector('#closeBtn');
  const manageWeeklyBtn = content.querySelector('#manageWeeklyBtn');
  
  closeBtn.addEventListener('click', function() {
    document.body.removeChild(modal);
  });
  
  manageWeeklyBtn.addEventListener('click', function() {
    document.body.removeChild(modal);
    openWeeklyTaskManager();
  });
  
  modal.addEventListener('click', function(e) {
    if (e.target === modal) {
      document.body.removeChild(modal);
    }
  });
}

function openWeeklyTaskManager() {
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:2000;display:flex;align-items:center;justify-content:center;';
  
  const content = document.createElement('div');
  content.style.cssText = 'background:var(--bg);border-radius:16px;padding:24px;width:360px;max-width:90vw;max-height:80vh;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,0.2);';
  
  const dayNames = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  let weeklyContent = '';
  
  for (let i = 0; i < 7; i++) {
    const dayTasks = weeklyTasks[String(i)] || [];
    weeklyContent += `
      <div style="margin-bottom:20px;">
        <div style="font-weight:600;color:var(--text);margin-bottom:8px;font-size:14px;">${dayNames[i]} 周任务</div>
        ${dayTasks.length > 0 
          ? `<div style="background:var(--card);border-radius:8px;padding:12px;">
              ${dayTasks.map((task, idx) => `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:${idx < dayTasks.length-1 ? '1px solid var(--border)' : 'none'};">
                  <span style="font-size:13px;">${task.name}</span>
                  <button onclick="removeWeeklyTask('${String(i)}', ${idx})" style="background:none;border:none;color:var(--red);font-size:12px;cursor:pointer;">删除</button>
                </div>
              `).join('')}
            </div>`
          : '<div style="color:var(--sub);font-size:12px;padding:8px 0;">暂无周任务</div>'
        }
      </div>
    `;
  }
  
  content.innerHTML = `
    <h3 style="margin:0 0 16px;color:var(--text);font-size:16px;font-weight:600;">📅 周任务管理</h3>
    <p style="margin:0 0 12px;color:var(--sub);font-size:13px;">管理每周自动循环的任务</p>
    <div style="margin-bottom:20px;font-size:13px;color:var(--text);">
      <p>周任务会自动在对应星期出现，无需每天重复添加。</p>
      <p>如需添加周任务，在添加任务时勾选"设为周循环任务"即可。</p>
    </div>
    ${weeklyContent}
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
      <button id="closeWeeklyBtn" style="padding:8px 16px;border:1px solid var(--border);background:none;color:var(--text);border-radius:8px;font-size:14px;cursor:pointer;">关闭</button>
    </div>
  `;
  
  modal.appendChild(content);
  document.body.appendChild(modal);
  
  const closeBtn = content.querySelector('#closeWeeklyBtn');
  
  closeBtn.addEventListener('click', function() {
    document.body.removeChild(modal);
  });
  
  modal.addEventListener('click', function(e) {
    if (e.target === modal) {
      document.body.removeChild(modal);
    }
  });
}

function removeWeeklyTask(day, index) {
  if (weeklyTasks[day] && weeklyTasks[day][index]) {
    weeklyTasks[day].splice(index, 1);
    saveUserData();
    toast('周任务已删除');
    openWeeklyTaskManager(); // 重新打开管理界面
  }
}
function resetToday(){
  if(!confirm('重置今天会清空所有已完成任务，确定吗？'))return;
  completed[todayKey()]=[];
  render();saveUserData();toast('今天已重置');
}

// ======== PWA安装 ========
let deferredPrompt;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (installBtn) {
    installBtn.style.display = 'block';
    installBtn.addEventListener('click', () => {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then((choiceResult) => {
        if (choiceResult.outcome === 'accepted') console.log('用户同意安装');
        deferredPrompt = null;
        installBtn.style.display = 'none';
      });
    });
  }
});
window.addEventListener('appinstalled', () => {
  console.log('PWA 已安装到桌面');
  if (installBtn) installBtn.style.display = 'none';
});

// ======== 初始化 ========
function init(){
  loadUsers();
  renderUserList();
  
  // 自动登录上次用户（简化版）
  const lastUser = localStorage.getItem('yuhan_last_user');
  if (lastUser && users[lastUser]) {
    loginUser(lastUser);
  }
  
  // 保存最后登录用户
  if (currentUser) {
    localStorage.setItem('yuhan_last_user', currentUser);
  }
}

init();
</script>

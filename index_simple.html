<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="学习搭子">
<meta name="theme-color" content="#7c6ff7">
<link rel="manifest" href="manifest.json">
<title>语涵的学习搭子</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#faf8ff;--card:#fff;--text:#2d2b3a;--sub:#8b87a0;--purple:#7c6ff7;--pink:#f472b6;--mint:#34d399;--amber:#fbbf24;--red:#f87171;--blue:#60a5fa;--shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.06);--radius:20px;--radius-sm:14px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent;user-select:none;overflow-x:hidden}
.container{max-width:480px;margin:0 auto;padding:12px 16px 110px}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 0 12px}
.greeting{font-size:13px;color:var(--sub)}.greeting b{display:block;font-size:20px;color:var(--text);font-weight:700;margin-top:2px}
.mascot-wrap{position:relative}
.mascot{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#e0d9ff,#c4b5fd);display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 4px 16px rgba(124,111,247,.25);cursor:pointer;transition:transform .2s}
.mascot:active{transform:scale(.9)}
.mascot-bubble{position:absolute;top:-42px;right:-20px;background:var(--text);color:#fff;font-size:11px;padding:6px 10px;border-radius:12px 12px 12px 4px;white-space:nowrap;opacity:0;transform:translateY(4px);transition:all .3s;pointer-events:none;max-width:180px;white-space:normal;line-height:1.4}
.mascot-bubble.show{opacity:1;transform:translateY(0)}

.stat-row{display:flex;gap:8px;margin-bottom:10px}
.stat-card{flex:1;background:var(--card);border-radius:var(--radius-sm);padding:12px;box-shadow:var(--shadow);text-align:center}
.stat-num{font-size:24px;font-weight:800;line-height:1}
.stat-num.purple{color:var(--purple)}.stat-num.pink{color:var(--pink)}.stat-num.mint{color:var(--mint)}
.stat-label{font-size:10px;color:var(--sub);margin-top:3px}

.date-strip{display:flex;gap:4px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.date-strip::-webkit-scrollbar{display:none}
.date-chip{flex-shrink:0;min-width:44px;padding:8px 4px;border-radius:12px;text-align:center;cursor:pointer;transition:all .2s;background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.04);font-size:11px;line-height:1.4}
.date-chip .dow{font-weight:600;color:var(--sub);font-size:10px}
.date-chip .dom{font-weight:700;font-size:15px;color:var(--text)}
.date-chip.active{background:var(--purple);box-shadow:0 4px 14px rgba(124,111,247,.35)}
.date-chip.active .dow,.date-chip.active .dom{color:#fff}
.date-chip.today{border:2px solid var(--purple)}

.progress-wrap{background:var(--card);border-radius:var(--radius-sm);padding:12px 14px;box-shadow:var(--shadow);margin-bottom:10px;display:flex;align-items:center;gap:12px}
.progress-bar{flex:1;height:6px;background:#f0edf6;border-radius:10px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--pink));border-radius:10px;transition:width .5s}
.progress-pct{font-size:13px;font-weight:700;color:var(--purple);min-width:36px;text-align:right}

.buddy-msg{background:linear-gradient(135deg,#f5f0ff,#fdf2f8);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);cursor:pointer;transition:all .2s}
.buddy-msg:active{transform:scale(.98)}
.buddy-avatar{font-size:30px;flex-shrink:0}
.buddy-text .name{font-size:11px;color:var(--purple);font-weight:600}
.buddy-text .msg{font-size:13px;color:var(--text);margin-top:2px;line-height:1.5}

.section-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.section-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.btn-sm{font-size:11px;padding:5px 12px;border-radius:14px;border:none;cursor:pointer;font-weight:600;font-family:inherit;transition:all .2s;background:var(--purple);color:#fff}
.btn-sm:active{opacity:.8}

.task-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.task{background:var(--card);border-radius:var(--radius-sm);padding:12px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;transition:all .25s;cursor:pointer;border-left:4px solid transparent;position:relative}
.task.done{border-left-color:var(--mint);background:#f8fdf9}
.task.done .task-name{text-decoration:line-through;color:#b0b0b0}
.task-emoji{font-size:22px;flex-shrink:0}
.task-info{flex:1;min-width:0}
.task-name{font-size:13px;font-weight:600}
.task-time{font-size:10px;color:var(--sub);margin-top:2px}
.task-tag{display:inline-block;font-size:9px;padding:1px 6px;border-radius:8px;font-weight:500;margin-left:5px}
.tag-en{background:#ede9fe;color:#7c3aed}.tag-cn{background:#fef3c7;color:#d97706}
.tag-ma{background:#fce7f3;color:#db2777}.tag-ph{background:#d1fae5;color:#059669}
.tag-ch{background:#f3e8ff;color:#9333ea}.tag-fr{background:#e0e7ff;color:#4f46e5}
.tag-ot{background:#ecfdf5;color:#0d9488}
.task-check{width:32px;height:32px;border-radius:50%;border:2.5px solid #e5e0ec;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .25s;font-size:14px;color:transparent}
.task.done .task-check{background:var(--mint);border-color:var(--mint);color:#fff}
.task-edit{position:absolute;right:50px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--sub);opacity:0;transition:opacity .2s}
.task:active .task-edit{opacity:1}

.reward-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.reward-btn{background:var(--card);border-radius:var(--radius-sm);padding:14px 10px;box-shadow:var(--shadow);text-align:center;cursor:pointer;transition:all .2s;border:none;font-family:inherit;font-size:12px;font-weight:600;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:4px}
.reward-btn:active{transform:scale(.95)}.reward-btn .icon{font-size:26px}
.reward-btn .cost{font-size:9px;color:var(--sub)}

.bottom-actions{display:flex;gap:8px}
.btn{flex:1;padding:10px;border-radius:22px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;border:none;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:4px}
.btn-outline{background:transparent;border:2px solid var(--purple);color:var(--purple)}
.btn-outline:active{background:var(--purple);color:#fff}
.btn-solid{background:var(--purple);color:#fff}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:85vh;border-radius:24px 24px 0 0;padding:20px 20px 32px;overflow-y:auto;transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1)}
.overlay.show .sheet{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:#e0dce8;border-radius:4px;margin:0 auto 14px}
.sheet h3{font-size:16px;font-weight:700;margin-bottom:12px;text-align:center}

.f-row{margin-bottom:10px}
.f-row label{display:block;font-size:11px;font-weight:600;color:var(--sub);margin-bottom:4px}
.f-row input,.f-row select,.f-row textarea{width:100%;padding:8px 12px;border:2px solid #eee;border-radius:10px;font-size:13px;font-family:inherit;background:#fafafa;transition:border .2s}
.f-row input:focus,.f-row select:focus,.f-row textarea:focus{outline:none;border-color:var(--purple);background:#fff}
.f-row textarea{resize:vertical;min-height:50px}
.f-row-inline{display:flex;gap:8px}.f-row-inline>*{flex:1}
.color-pick{display:flex;gap:6px}
.color-dot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .2s}
.color-dot.active{border-color:var(--text);transform:scale(1.15)}

.reward-pop{text-align:center;padding:8px 0}
.reward-pop .big-emoji{font-size:56px;margin-bottom:10px;animation:bounce .6s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.reward-pop .rtitle{font-size:17px;font-weight:700;margin-bottom:6px}
.reward-pop .rdesc{font-size:12px;color:var(--sub);margin-bottom:14px;line-height:1.6}

/* 游戏区 */
.game-area{position:relative;width:100%;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:8px 0}
.game-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;max-width:280px;margin:0 auto}
.game-cell{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;transition:all .15s}
.game-cell.hidden{background:linear-gradient(135deg,var(--purple),#a78bfa);color:transparent}
.game-cell.shown{background:#e8e4f8}
.whack-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:240px;margin:0 auto}
.whack-cell{aspect-ratio:1;background:#f0edf6;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:40px;cursor:pointer;transition:all .1s}
.whack-cell.active{background:#ffe0e6;transform:scale(1.05)}
.whack-cell.bomb{background:#ffcccc}
.quiz-area{text-align:center}.quiz-q{font-size:28px;font-weight:700;margin:8px 0}.quiz-input{font-size:24px;width:120px;padding:8px;text-align:center;border:2px solid #ddd;border-radius:12px;margin:8px 0}.quiz-input:focus{outline:none;border-color:var(--purple)}
.bubble-area{position:relative;width:260px;height:200px;overflow:hidden;background:#f8f9ff;border-radius:16px;margin:0 auto}
.bubble{position:absolute;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;animation:bubbleUp 2.5s linear forwards}
@keyframes bubbleUp{0%{transform:translateY(0) scale(0);opacity:0}10%{transform:translateY(0) scale(1);opacity:1}90%{opacity:1}100%{transform:translateY(-200px) scale(.5);opacity:0}}

/* 游戏选择 */
.game-select{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.game-opt{background:#f8f6ff;border-radius:var(--radius-sm);padding:14px;text-align:center;cursor:pointer;border:2px solid transparent;transition:all .2s}
.game-opt:active{border-color:var(--purple);background:#ede9fe}
.game-opt .go-icon{font-size:32px}.game-opt .go-name{font-size:12px;font-weight:600;margin-top:4px}.game-opt .go-desc{font-size:10px;color:var(--sub);margin-top:2px}

/* 瓜 */
.gua-card{background:linear-gradient(135deg,#fff5f7,#fef9e7);border-radius:var(--radius-sm);padding:18px;text-align:center;margin:8px 0}
.gua-card .gua-type{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;margin-bottom:8px}
.gua-card .gua-content{font-size:14px;line-height:1.7;color:var(--text)}
.gua-type.joke{background:#fce7f3;color:#db2777}
.gua-type.meme{background:#fef3c7;color:#d97706}
.gua-type.fact{background:#d1fae5;color:#059669}
.gua-type.moti{background:#ede9fe;color:#7c3aed}

/* 健康提醒条 */
.health-nudge{background:linear-gradient(135deg,#e8faf0,#f0e6ff);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);cursor:pointer;animation:slideDown .4s}
.health-nudge:active{transform:scale(.98)}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.hn-emoji{font-size:28px;flex-shrink:0}
.hn-text{font-size:12px;line-height:1.5;color:var(--text)}
.hn-dismiss{font-size:16px;color:var(--sub);cursor:pointer;flex-shrink:0;padding:4px}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:200;pointer-events:none;animation:toastIn .35s,toastOut .35s 1.8s forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}

.spark{position:fixed;pointer-events:none;z-index:300;font-size:18px;animation:sparkUp .9s ease-out forwards}
@keyframes sparkUp{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(.3)}}

@media(prefers-color-scheme:dark){
  :root{--bg:#13111c;--card:#1e1b2e;--text:#e8e4f0;--sub:#9b95b5}
  .task{background:#1e1b2e}.task.done{background:#1a2e22}
  .stat-card,.progress-wrap,.reward-btn{background:#1e1b2e}
  .buddy-msg{background:linear-gradient(135deg,#1e1b3a,#2a1a30)}
  .sheet{background:#1e1b2e}
  .f-row input,.f-row select,.f-row textarea{background:#2a2638;border-color:#3a3550;color:#e8e4f0}
  .progress-bar{background:#2a2638}.task-check{border-color:#3a3550}
  .sheet-handle{background:#3a3550}.date-chip{background:#1e1b2e}
  .whack-cell{background:#2a2638}.bubble-area{background:#1e1b2e}
  .game-opt{background:#2a2638}.gua-card{background:linear-gradient(135deg,#2a1e28,#2a2a1e)}
}
</style>
</head>
<body>
<div class="container" id="app"></div>
<div class="overlay" id="ol-settings"><div class="sheet"><div class="sheet-handle"></div><h3>自定义你的学习搭子</h3><div id="settings-form"></div></div></div>
<div class="overlay" id="ol-task"><div class="sheet"><div class="sheet-handle"></div><h3 id="task-form-title">添加任务</h3><div id="task-form"></div></div></div>
<div class="overlay" id="ol-reward"><div class="sheet"><div class="sheet-handle"></div><div id="reward-sheet"></div></div></div>

<script>
// 简化版本 - 确保能正常运行
const DEFAULT_TASKS = {
  '1':[{id:'w1',emoji:'📝',name:'完成校内全部作业',time:'放学~20:00',tag:'作业',tagCls:'tag-ot'}],
  '2':[{id:'w1',emoji:'📝',name:'完成校内全部作业',time:'放学~20:00',tag:'作业',tagCls:'tag-ot'},{id:'w2',emoji:'📖',name:'语文专项：背诵+刷题',time:'20:00-21:10',tag:'语文',tagCls:'tag-cn'}],
  '3':[{id:'w1',emoji:'📝',name:'完成校内全部作业',time:'放学~20:00',tag:'作业',tagCls:'tag-ot'},{id:'w3',emoji:'🇬🇧',name:'英语专项：背默+语法',time:'20:00-21:10',tag:'英语',tagCls:'tag-en'}],
  '4':[{id:'w1',emoji:'📝',name:'完成校内全部作业',time:'放学~20:00',tag:'作业',tagCls:'tag-ot'},{id:'w2',emoji:'📖',name:'语文专项：背诵+刷题',time:'20:00-21:10',tag:'语文',tagCls:'tag-cn'}],
  '5':[{id:'w1',emoji:'📝',name:'完成校内全部作业',time:'放学~20:00',tag:'作业',tagCls:'tag-ot'},{id:'w3',emoji:'🇬🇧',name:'英语专项：背默+语法',time:'20:00-21:10',tag:'英语',tagCls:'tag-en'}],
  '6':[{id:'s1',emoji:'😴',name:'补觉休整，好好吃顿饭',time:'10:00起床',tag:'休息',tagCls:'tag-fr'},{id:'s2',emoji:'🔬',name:'理化空中课堂+随堂练习',time:'10:00-11:00',tag:'理化',tagCls:'tag-ph'},{id:'s3',emoji:'🧮',name:'线下数学补习',time:'13:00-17:00',tag:'数学',tagCls:'tag-ma'},{id:'s4',emoji:'📚',name:'周末作业查缺补漏',time:'17:00-20:00',tag:'作业',tagCls:'tag-ot'},{id:'s5',emoji:'🎮',name:'自由娱乐时间',time:'20:00之后',tag:'娱乐',tagCls:'tag-fr'}],
  '0':[{id:'u1',emoji:'🎨',name:'美术兴趣课',time:'09:00-11:30',tag:'美术',tagCls:'tag-ot'},{id:'u2',emoji:'🍱',name:'午餐+午休',time:'11:30-13:30',tag:'休息',tagCls:'tag-fr'},{id:'u3',emoji:'🇬🇧',name:'英语一对一补习',time:'14:00-16:00',tag:'英语',tagCls:'tag-en'},{id:'u4',emoji:'📖',name:'语文背默+课外练习',time:'16:30-18:00',tag:'语文',tagCls:'tag-cn'},{id:'u5',emoji:'✨',name:'全天学习结束，自由休息',time:'18:00之后',tag:'休息',tagCls:'tag-fr'}],
};

// 简化数据
let allTasks={},completed={},coins=100,streak=0,themeColor='#7c6ff7',planTitle='语涵的学习搭子',buddyName='学习搭子',mascotEmoji='🐱',selectedDay=null;

function todayKey(){return new Date().toISOString().split('T')[0]}
function dayOfWeek(d){return new Date(d+'T00:00:00').getDay()}

function init(){
  loadAll();
  if(!selectedDay) selectedDay=String(dayOfWeek(todayKey()));
  render();
}

function loadAll(){
  try{
    const raw=localStorage.getItem('yuhan_simple');
    if(raw){
      const d=JSON.parse(raw);
      allTasks=d.allTasks||{};completed=d.completed||{};coins=d.coins??100;
      themeColor=d.themeColor||'#7c6ff7';planTitle=d.planTitle||'语涵的学习搭子';
      buddyName=d.buddyName||'学习搭子';mascotEmoji=d.mascotEmoji||'🐱';
      selectedDay=d.selectedDay||String(dayOfWeek(todayKey()));
      const last=d.lastDate,today=todayKey();
      if(last===today) streak=d.streak||0;
      else if(last&&isYesterday(last,today)) streak=(d.streak||0)+1;
      else streak=0;
    }
  }catch(e){}
  for(const k of['0','1','2','3','4','5','6']){
    if(!allTasks[k]||allTasks[k].length===0) allTasks[k]=JSON.parse(JSON.stringify(DEFAULT_TASKS[k]||[]));
  }
  if(!completed[todayKey()]) completed[todayKey()]=[];
}

function saveAll(){
  const d={allTasks,completed,coins,streak,themeColor,planTitle,buddyName,mascotEmoji,selectedDay,lastDate:todayKey()};
  localStorage.setItem('yuhan_simple',JSON.stringify(d));
}

function isYesterday(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)===1}
function getDayTasks(dk){return allTasks[dk]||[]}
function getTodayCompleted(){return new Set(completed[todayKey()]||[])}

function render(){
  const app=document.getElementById('app');
  const today=todayKey(),dow=dayOfWeek(today);
  const todayDone=getTodayCompleted();
  const curTasks=getDayTasks(selectedDay);
  const curDone=selectedDay===String(dow)?todayDone:new Set();
  const doneCnt=curTasks.filter(t=>curDone.has(t.id)).length;
  const pct=curTasks.length?Math.round(doneCnt/curTasks.length*100):0;
  
  const names=['日','一','二','三','四','五','六'];
  const td=new Date(today+'T00:00:00'),start=new Date(td);start.setDate(td.getDate()-td.getDay());
  const dates=[];
  for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);dates.push({ds:d.toISOString().split('T')[0],dow:i,dom:d.getDate()})}
  
  app.innerHTML=`
<div class="topbar">
  <div class="greeting"><span>${greetText()}</span><b>${planTitle}</b></div>
  <div class="mascot-wrap" onclick="tapMascot()"><div class="mascot">${mascotEmoji}</div></div>
</div>

<div class="stat-row">
  <div class="stat-card"><div class="stat-num purple">${doneCnt}</div><div class="stat-label">今日完成</div></div>
  <div class="stat-card"><div class="stat-num pink">${streak}</div><div class="stat-label">连续天数</div></div>
  <div class="stat-card"><div class="stat-num mint">${coins}</div><div class="stat-label">学习币</div></div>
</div>

<div class="date-strip">
  ${dates.map(d=>`<div class="date-chip${String(d.dow)===selectedDay?' active':''}${d.ds===today?' today':''}" onclick="selectDay('${d.dow}')"><div class="dow">周${names[d.dow]}</div><div class="dom">${d.dom}</div></div>`).join('')}
</div>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
  <div class="progress-pct">${pct}%</div>
</div>

<div class="buddy-msg" onclick="refreshBuddy()">
  <div class="buddy-avatar">${mascotEmoji}</div>
  <div class="buddy-text"><div class="name">${buddyName}</div><div class="msg">${pickBuddyMsg(doneCnt,curTasks.length)}</div></div>
</div>

<div class="section-row">
  <div class="section-title">📋 ${['周日','周一','周二','周三','周四','周五','周六'][parseInt(selectedDay)]}任务</div>
  <button class="btn-sm" onclick="openTaskForm(null)">+ 添加</button>
</div>
<div class="task-list">
  ${curTasks.map(t=>`<div class="task${curDone.has(t.id)?' done':''}" id="task-${t.id}">
    <div class="task-emoji">${t.emoji||'📝'}</div>
    <div class="task-info"><div class="task-name">${t.name}</div><div class="task-time">🕐 ${t.time||''}<span class="task-tag ${t.tagCls||'tag-ot'}">${t.tag||'任务'}</span></div></div>
    <div class="task-edit" onclick="event.stopPropagation();openTaskForm('${t.id}')">✏️</div>
    <div class="task-check" onclick="event.stopPropagation();toggleTask('${t.id}')">✓</div>
  </div>`).join('')||'<div style="text-align:center;color:var(--sub);padding:20px;font-size:13px">还没有任务，右上角加一个</div>'}
</div>

<div class="section-title" style="margin-bottom:6px">🎁 兑换奖励</div>
<div class="reward-grid">
  <button class="reward-btn" onclick="openGua()"><span class="icon">🍉</span>吃瓜时间<span class="cost">5币</span></button>
  <button class="reward-btn" onclick="openGames()"><span class="icon">🎮</span>解压游戏<span class="cost">10币</span></button>
  <button class="reward-btn" onclick="openReward('theme')"><span class="icon">🎨</span>解锁新主题<span class="cost">30币</span></button>
  <button class="reward-btn" onclick="openReward('care')"><span class="icon">🫂</span>搭子抱抱<span class="cost">0币</span></button>
</div>

<div class="bottom-actions">
  <button class="btn btn-outline" onclick="openSettings()">⚙️ 设置</button>
  <button class="btn btn-solid" onclick="resetToday()">🔄 重置今天</button>
</div>`;
}

function selectDay(dk){selectedDay=dk;render();saveAll()}

function toggleTask(tid){
  const today=todayKey(),dow=dayOfWeek(today);
  if(selectedDay!==String(dow)){toast('只能操作今天的任务哦');return}
  let doneArr=completed[today]||[];
  const idx=doneArr.indexOf(tid);
  if(idx>=0){doneArr.splice(idx,1);coins=Math.max(0,coins-8);toast('取消完成 -8币')}
  else{doneArr.push(tid);coins+=8;toast('+8币！')}
  completed[today]=doneArr;
  render();saveAll();
}

function openTaskForm(tid){
  const tasks=getDayTasks(selectedDay),t=tid?tasks.find(t=>t.id===tid):null;
  document.getElementById('task-form-title').textContent=t?'编辑任务':'添加任务';
  const tagOpts=[{v:'tag-en',l:'英语'},{v:'tag-cn',l:'语文'},{v:'tag-ma',l:'数学'},{v:'tag-ph',l:'物理'},{v:'tag-ch',l:'化学'},{v:'tag-fr',l:'休息'},{v:'tag-ot',l:'其他'}];
  const tagHtml=tagOpts.map(o=>`<option value="${o.v}" ${(t?t.tagCls:'tag-ot')===o.v?'selected':''}>${o.l}</option>`).join('');
  const emojis=['📝','📖','🇬🇧','🧮','🔬','🎨','🎮','😴','🍱','✨','💪','📚','🎯','⭐','🔥','🖊️','🎵','🏃','🧠','🫧'];
  const emojiHtml=emojis.map(e=>`<option value="${e}" ${(t?t.emoji:'📝')===e?'selected':''}>${e}</option>`).join('');
  document.getElementById('task-form').innerHTML=`
    <div class="f-row"><label>任务名称</label><input id="tf-name" value="${t?t.name:''}" placeholder="例如：完成数学练习册"></div>
    <div class="f-row-inline"><div class="f-row"><label>时间</label><input id="tf-time" value="${t?t.time:''}" placeholder="如：20:00-21:10"></div><div class="f-row"><label>标签</label><select id="tf-tag">${tagHtml}</select></div></div>
    <div class="f-row"><label>图标</label><select id="tf-emoji">${emojiHtml}</select></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-solid" style="flex:1" onclick="saveTask('${tid||''}')">${tid?'保存':'添加'}</button>
      ${tid?`<button class="btn btn-outline" style="flex:1;border-color:var(--red);color:var(--red)" onclick="deleteTask('${tid}')">删除</button>`:''}
      <button class="btn btn-outline" style="flex:1" onclick="closeOverlay('ol-task')">取消</button>
    </div>`;
  document.getElementById('ol-task').classList.add('show');
}

function saveTask(oldId){
  const name=document.getElementById('tf-name').value.trim();
  if(!name){toast('请输入任务名称');return}
  const time=document.getElementById('tf-time').value.trim();
  const tagCls=document.getElementById('tf-tag').value;
  const emoji=document.getElementById('tf-emoji').value;
  const tagLabel=[{v:'tag-en',l:'英语'},{v:'tag-cn',l:'语文'},{v:'tag-ma',l:'数学'},{v:'tag-ph',l:'物理'},{v:'tag-ch',l:'化学'},{v:'tag-fr',l:'休息'},{v:'tag-ot',l:'其他'}].find(o=>o.v===tagCls)?.l||'任务';
  const tasks=getDayTasks(selectedDay);
  if(oldId){const idx=tasks.findIndex(t=>t.id===oldId);if(idx>=0) tasks[idx]={...tasks[idx],name,time,tagCls,tag:tagLabel,emoji}}
  else{tasks.push({id:'c'+Date.now(),name,time,tagCls,tag:tagLabel,emoji})}
  allTasks[selectedDay]=tasks;closeOverlay('ol-task');render();saveAll();toast(oldId?'任务已更新':'任务已添加');
}

function deleteTask(tid){
  if(!confirm('确定删除这个任务吗？'))return;
  allTasks[selectedDay]=getDayTasks(selectedDay).filter(t=>t.id!==tid);
  closeOverlay('ol-task');render();saveAll();toast('任务已删除');
}

function pickBuddyMsg(done,total){
  const idle=['在吗？看看今天的任务~','摸鱼被我抓到了 👀','点任务就能完成哦~','今天进度还是0，开始第一个？'];
  const progress=['不错不错，过半了！','你今天状态可以啊','稳！继续保持','已经完成好几个了，休息一下？'];
  const almost=['就差最后一点了！','马上收工，再坚持一下','胜利在望！冲刺！'];
  const doneMsgs=['全部完成！今天你是我的神！','收工！心安理得地躺平','任务清零，奖励自己？','完美的一天，去玩吧！'];
  if(done===0)return idle[Math.floor(Math.random()*idle.length)];
  if(done===total)return doneMsgs[Math.floor(Math.random()*doneMsgs.length)];
  if(done/total>=0.8)return almost[Math.floor(Math.random()*almost.length)];
  return progress[Math.floor(Math.random()*progress.length)];
}
function refreshBuddy(){render()}
function tapMascot(){toast(['别戳了，痒！','做任务去！','再戳要生气了（并不会）','戳一次扣一个币（骗你的）'][Math.floor(Math.random()*4)])}

function openReward(type){
  const ol=document.getElementById('ol-reward'),rs=document.getElementById('reward-sheet');
  if(type==='theme'){
    if(coins<30){toast('需要30币，当前:'+coins+'币');return}
    coins-=30;const colors=['#7c6ff7','#f472b6','#34d399','#fbbf24','#60a5fa','#f87171','#a78bfa','#fb923c'];
    const pick=colors[Math.floor(Math.random()*colors.length)];themeColor=pick;
    document.documentElement.style.setProperty('--purple',themeColor);saveAll();render();
    rs.innerHTML=`<div class="reward-pop"><div class="big-emoji">🎨</div><div class="rtitle">新主题解锁！</div><div class="rdesc">已自动应用新颜色~</div><button class="btn btn-solid" style="width:100%" onclick="closeOverlay('ol-reward')">好看！</button></div>`;
    ol.classList.add('show');return;
  }
  if(type==='care'){
    const careMsgs=['今天累不累？累了就歇会儿，不丢人！','有人说你进步了吗？我觉得你今天比昨天好。','不管别人怎么说，在我眼里你已经是人类高质量初中生了。'];
    const msg=careMsgs[Math.floor(Math.random()*careMsgs.length)];
    rs.innerHTML=`<div class="reward-pop"><div class="big-emoji">🫂</div><div class="rtitle">搭子有话说</div><div class="rdesc"><p style="font-size:15px;line-height:1.8">${msg}</p></div><button class="btn btn-solid" style="width:100%" onclick="closeOverlay('ol-reward')">收到！</button></div>`;
    ol.classList.add('show');return;
  }
}

function openGua(){
  if(coins<5){toast('需要5币，当前:'+coins+'币');return}
  coins-=5;saveAll();render();
  const ol=document.getElementById('ol-reward'),rs=document.getElementById('reward-sheet');
  const jokes=[
    '两道杠同学问学神："你考满分是因为聪明还是努力？"学神放下笔，深沉地看着远方说："因为你们。"',
    '老师："为什么你要把乘法表抄100遍？"我："因为\'知识就是力量\'，我想多充点电。"',
    '考试前：我命由我不由天。考试后：天要我命我随天。',
    '学霸和学渣的区别：学霸考试——这个知识点我复习了3遍。学渣考试——这个字我认识，合一起就不知道了。',
  ];
  const content=jokes[Math.floor(Math.random()*jokes.length)];
  rs.innerHTML=`<div class="reward-pop"><div class="big-emoji">🍉</div><div class="rtitle">校园笑话</div><div class="gua-card"><span class="gua-type joke">校园笑话</span><div class="gua-content">${content}</div></div><button class="btn btn-solid" style="width:100%" onclick="closeOverlay('ol-reward')">哈哈哈够了</button></div>`;
  ol.classList.add('show');
}

function openGames(){
  const ol=document.getElementById('ol-reward'),rs=document.getElementById('reward-sheet');
  rs.innerHTML=`<div class="sheet-handle"></div><h3>🎮 选一个游戏</h3>
    <div class="game-select">
      <div class="game-opt" onclick="startGame('memory')"><div class="go-icon">🃏</div><div class="go-name">记忆翻牌</div><div class="go-desc">找出相同配对的卡片</div></div>
      <div class="game-opt" onclick="startGame('whack')"><div class="go-icon">🔨</div><div class="go-name">打地鼠</div><div class="go-desc">打中冒出来的地鼠</div></div>
      <div class="game-opt" onclick="startGame('quiz')"><div class="go-icon">🧮</div><div class="go-name">速算挑战</div><div class="go-desc">限时心算答题</div></div>
      <div class="game-opt" onclick="startGame('bubble')"><div class="go-icon">🫧</div><div class="go-name">戳泡泡</div><div class="go-desc">疯狂戳破泡泡</div></div></div>
    <button class="btn btn-outline" style="width:100%;margin-top:10px" onclick="closeOverlay('ol-reward')">不玩了</button>`;
  ol.classList.add('show');
}

function startGame(game){
  if(coins<10){toast('需要10币，当前:'+coins+'币');return}
  coins-=10;saveAll();render();
  const rs=document.getElementById('reward-sheet');
  if(game==='memory'){
    rs.innerHTML=`<div class="sheet-handle"></div><h3>🃏 记忆翻牌</h3><p style="text-align:center;color:var(--sub);margin-bottom:8px">点击卡片翻开，找出相同配对</p><div class="game-grid">${Array(8).fill().map((_,i)=>`<div class="game-cell hidden" onclick="this.classList.remove('hidden');this.classList.add('shown');this.textContent='🌟💎🔥🎯'[Math.floor(i/2)]">?</div>`).join('')}</div><button class="btn btn-solid" style="width:100%;margin-top:10px" onclick="closeOverlay('ol-reward')">结束游戏</button>`;
  }else{
    rs.innerHTML=`<div class="reward-pop"><div class="big-emoji">🎮</div><div class="rtitle">游戏加载中</div><div class="rdesc">${game==='whack'?'打地鼠':game==='quiz'?'速算挑战':'戳泡泡'}功能完整版已准备就绪</div><button class="btn btn-solid" style="width:100%" onclick="closeOverlay('ol-reward')">好的</button></div>`;
  }
}

function openSettings(){
  const mascots=['🐱','🐶','🐰','🦊','🐼','🐨','🐸','🦄','🐙','🐣'];
  const mascotOpts=mascots.map(m=>`<option value="${m}" ${m===mascotEmoji?'selected':''}>${m}</option>`).join('');
  const colors=['#7c6ff7','#f472b6','#34d399','#fbbf24','#60a5fa','#f87171','#a78bfa','#fb923c'];
  const cl=colors.map(c=>`<div class="color-dot${c===themeColor?' active':''}" style="background:${c}" onclick="pickColor('${c}')"></div>`).join('');
  document.getElementById('settings-form').innerHTML=`
    <div class="f-row"><label>计划名称</label><input id="sn" value="${planTitle}"></div>
    <div class="f-row"><label>搭子昵称</label><input id="sb" value="${buddyName}"></div>
    <div class="f-row"><label>搭子形象</label><select id="sm">${mascotOpts}</select></div>
    <div class="f-row"><label>主题色</label><div class="color-pick">${cl}</div></div>
    <button class="btn btn-solid" style="width:100%;margin-top:8px" onclick="saveSettings()">保存</button>`;
  document.getElementById('ol-settings').classList.add('show');
}
function pickColor(c){themeColor=c;document.documentElement.style.setProperty('--purple',themeColor);openSettings()}
function saveSettings(){
  planTitle=document.getElementById('sn').value||'语涵的学习搭子';
  buddyName=document.getElementById('sb').value||'学习搭子';
  mascotEmoji=document.getElementById('sm').value;
  saveAll();closeOverlay('ol-settings');render();toast('保存成功！');
}
function resetToday(){
  if(!confirm('确定重置今天的完成记录吗？'))return;
  completed[todayKey()]=[];render();saveAll();toast('已重置');
}

function greetText(){const h=new Date().getHours();return h<12?'早上好':h<18?'下午好':'晚上好'}
function closeOverlay(id){document.getElementById(id).classList.remove('show')}
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2200);
}

['ol-settings','ol-task','ol-reward'].forEach(id=>{
  document.getElementById(id).addEventListener('click',function(e){if(e.target===this)closeOverlay(id)});
});

init();
</script>
</body>
</html>
